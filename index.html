<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111313">
  <title>異星防線 | 3D 生存射擊</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #101313;
      color: #f0eee7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: #101313;
    }

    button { font: inherit; }

    #game {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 70%, rgba(80, 95, 78, .2), transparent 55%),
        #101313;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse, transparent 38%, rgba(3, 5, 5, .62) 100%);
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 36px);
    }

    .topbar, .bottom-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ddd9ce;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(224, 207, 165, .5);
      color: #d3b987;
      font-size: 16px;
    }

    .brand small {
      display: block;
      margin-top: 5px;
      color: #82847d;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
    }

    .stats {
      display: flex;
      gap: clamp(18px, 4vw, 50px);
      text-align: right;
    }

    .stat-label, .eyebrow {
      color: #92958b;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 6px;
      color: #f0eee7;
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 750;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }

    .center-message {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(460px, calc(100vw - 36px));
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: auto;
    }

    .center-message[hidden] { display: none; }

    .panel {
      padding: clamp(25px, 5vw, 46px);
      border: 1px solid rgba(216, 201, 168, .18);
      background: rgba(15, 19, 18, .83);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
      backdrop-filter: blur(14px);
    }

    .eyebrow { color: #c9ab73; }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(34px, 8vw, 62px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: .98;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 330px;
      color: #a7aaa0;
      font-size: 14px;
      line-height: 1.8;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 18px;
      margin: 24px 0;
      padding: 17px 0;
      border-top: 1px solid rgba(255, 255, 255, .09);
      border-bottom: 1px solid rgba(255, 255, 255, .09);
      color: #b7b9b1;
      font-size: 12px;
      text-align: left;
    }

    kbd {
      display: inline-block;
      min-width: 29px;
      margin-right: 7px;
      padding: 4px 6px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 3px;
      color: #e8e3d6;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
    }

    .primary {
      min-width: 180px;
      padding: 13px 22px;
      border: 0;
      background: #c9a56a;
      color: #171813;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .16em;
      transition: background .2s, transform .2s;
    }

    .primary:hover {
      transform: translateY(-2px);
      background: #e0bd7f;
    }

    .bottom-bar {
      align-items: flex-end;
    }

    .health-wrap { width: min(220px, 34vw); }
    .health-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .health-value {
      color: #dfddd3;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .health-track {
      height: 4px;
      background: rgba(255, 255, 255, .16);
    }

    #health-fill {
      width: 100%;
      height: 100%;
      background: #c17a5b;
      transition: width .2s ease, background .2s ease;
    }

    .ammo {
      color: #f3efe3;
      font-size: clamp(18px, 3vw, 27px);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .ammo span {
      color: #8e9187;
      font-size: 14px;
      font-weight: 500;
    }

    .status-line {
      position: absolute;
      bottom: 13%;
      left: 50%;
      transform: translateX(-50%);
      color: #e1ddd1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
      text-shadow: 0 2px 8px #000;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-line[hidden] { display: none; }

    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 2;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
    }

    .crosshair::before, .crosshair::after {
      position: absolute;
      content: "";
      background: rgba(240, 235, 220, .88);
      box-shadow: 0 0 5px rgba(0, 0, 0, .8);
    }

    .crosshair::before {
      top: 8px;
      left: 2px;
      width: 14px;
      height: 1px;
    }

    .crosshair::after {
      top: 2px;
      left: 8px;
      width: 1px;
      height: 14px;
    }

    .crosshair.active { opacity: 1; }
    .crosshair.hit::before, .crosshair.hit::after { background: #e79266; }

    .damage-flash {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse, transparent 40%, rgba(180, 36, 24, .54));
      opacity: 0;
      transition: opacity .25s;
    }

    .damage-flash.active { opacity: 1; }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #101313;
      color: #c9ab73;
      font-size: 12px;
      letter-spacing: .2em;
    }

    .loading[hidden] { display: none; }

    @media (max-width: 520px) {
      .hud { padding: 16px; }
      .brand { font-size: 9px; }
      .brand-mark { width: 29px; height: 29px; }
      .stats { gap: 13px; }
      .stat-label { font-size: 8px; }
      .stat-value { font-size: 17px; }
      .status-line { bottom: 17%; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="異星防線 3D 遊戲場景"></main>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="damage-flash" id="damage-flash"></div>
  <div class="crosshair" id="crosshair"></div>

  <section class="hud" aria-live="polite">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">X</div>
        <div>LAST WATCH<small>QUARANTINE ZONE 07</small></div>
      </div>
      <div class="stats">
        <div>
          <div class="stat-label">WAVE</div>
          <div class="stat-value" id="wave">— / 3</div>
        </div>
        <div>
          <div class="stat-label">ELIMINATED</div>
          <div class="stat-value" id="score">000</div>
        </div>
      </div>
    </header>

    <div class="center-message" id="overlay">
      <div class="panel">
        <div class="eyebrow" id="overlay-eyebrow">QUARANTINE ZONE 07</div>
        <h1 id="overlay-title">異星防線</h1>
        <p class="subtitle" id="overlay-copy">隔離區出現陌生生物。準備好守住防線，撐過三波攻勢了嗎？</p>
        <div class="controls">
          <div><kbd>W A S D</kbd>移動</div>
          <div><kbd>MOUSE</kbd>瞄準</div>
          <div><kbd>CLICK</kbd>射擊</div>
          <div><kbd>R</kbd>重新裝填</div>
        </div>
        <button class="primary" id="start-button" type="button">進入戰場</button>
      </div>
    </div>

    <div class="status-line" id="status-line" hidden></div>

    <footer class="bottom-bar">
      <div class="health-wrap">
        <div class="health-head">
          <div class="stat-label">VITALS</div>
          <div class="health-value" id="health-value">100%</div>
        </div>
        <div class="health-track"><div id="health-fill"></div></div>
      </div>
      <div>
        <div class="stat-label" style="text-align:right;margin-bottom:6px">AMMUNITION</div>
        <div class="ammo"><span id="ammo-current">12</span> <span>/ <span id="ammo-reserve">60</span></span></div>
      </div>
    </footer>
  </section>
  <div class="loading" id="loading">正在載入戰場…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
  <script>
    (() => {
      "use strict";

      const mount = document.getElementById("game");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start-button");
      const crosshair = document.getElementById("crosshair");
      const statusLine = document.getElementById("status-line");
      const damageFlash = document.getElementById("damage-flash");
      const loading = document.getElementById("loading");
      const waveText = document.getElementById("wave");
      const scoreText = document.getElementById("score");
      const healthText = document.getElementById("health-value");
      const healthFill = document.getElementById("health-fill");
      const ammoText = document.getElementById("ammo-current");
      const reserveText = document.getElementById("ammo-reserve");

      if (!window.THREE) {
        loading.textContent = "無法載入 3D 引擎，請確認網路連線後重新整理。";
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x171b19);
      scene.fog = new THREE.FogExp2(0x171b19, 0.025);

      const camera = new THREE.PerspectiveCamera(74, 1, 0.1, 100);
      camera.position.set(0, 1.7, 7);
      scene.add(camera);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      mount.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xc8d1c1, 0x29251e, 1.55));
      const moon = new THREE.DirectionalLight(0xd6d0b4, 2.1);
      moon.position.set(-7, 12, 4);
      moon.castShadow = true;
      moon.shadow.mapSize.set(1024, 1024);
      moon.shadow.camera.left = -18;
      moon.shadow.camera.right = 18;
      moon.shadow.camera.top = 18;
      moon.shadow.camera.bottom = -18;
      scene.add(moon);

      const warmLamp = new THREE.PointLight(0xe99854, 18, 12, 2);
      warmLamp.position.set(4, 3, -4);
      scene.add(warmLamp);
      const coldLamp = new THREE.PointLight(0x73968c, 12, 14, 2);
      coldLamp.position.set(-5, 2.5, 3);
      scene.add(coldLamp);

      const mats = {
        floor: new THREE.MeshStandardMaterial({ color: 0x42423b, roughness: 0.96 }),
        wall: new THREE.MeshStandardMaterial({ color: 0x383d38, roughness: 0.94 }),
        concrete: new THREE.MeshStandardMaterial({ color: 0x56554b, roughness: 0.91 }),
        dark: new THREE.MeshStandardMaterial({ color: 0x222722, roughness: 0.72 }),
        metal: new THREE.MeshStandardMaterial({ color: 0x4b514a, roughness: 0.56, metalness: 0.52 }),
        warning: new THREE.MeshStandardMaterial({ color: 0xb58a4d, roughness: 0.72 }),
        glass: new THREE.MeshStandardMaterial({ color: 0x91a69b, roughness: 0.22, metalness: 0.5, transparent: true, opacity: 0.42 }),
        blood: new THREE.MeshStandardMaterial({ color: 0x4f2521, roughness: 0.98 })
      };

      const weapon = new THREE.Group();
      const weaponBody = new THREE.MeshStandardMaterial({ color: 0x252a27, roughness: 0.42, metalness: 0.62 });
      const weaponGrip = new THREE.MeshStandardMaterial({ color: 0x55483a, roughness: 0.86 });
      box(weapon, 0.17, 0.13, 0.35, weaponBody, 0, 0.02, -0.07, false);
      box(weapon, 0.12, 0.23, 0.13, weaponGrip, 0, -0.14, 0.01, false).rotation.x = -0.18;
      box(weapon, 0.18, 0.035, 0.28, mats.metal, 0, 0.1, -0.08, false);
      const weaponBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.28, 8), weaponBody);
      weaponBarrel.rotation.x = Math.PI / 2;
      weaponBarrel.position.set(0, 0.04, -0.32);
      weapon.add(weaponBarrel);
      weapon.position.set(0.29, -0.37, -0.68);
      weapon.scale.setScalar(0.62);
      camera.add(weapon);

      function box(parent, width, height, depth, material, x, y, z, castShadow = true) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
        mesh.position.set(x, y, z);
        mesh.castShadow = castShadow;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), mats.floor);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(80, 40, 0x686b5c, 0x55584d);
      grid.position.y = 0.012;
      grid.material.transparent = true;
      grid.material.opacity = 0.19;
      scene.add(grid);

      function addWall(width, height, depth, x, y, z, material = mats.wall) {
        box(scene, width, height, depth, material, x, y, z);
      }

      addWall(34, 5, 0.6, 0, 2.5, -17);
      addWall(34, 5, 0.6, 0, 2.5, 17);
      addWall(0.6, 5, 34, -17, 2.5, 0);
      addWall(0.6, 5, 34, 17, 2.5, 0);

      for (let i = 0; i < 10; i += 1) {
        const x = -14 + i * 3.1;
        box(scene, 2.3, 0.12, 0.08, i % 2 ? mats.warning : mats.dark, x, 0.42, -16.66, false);
      }

      function addCrate(x, z, scale = 1) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        scene.add(group);
        const w = 1.45 * scale;
        const h = 1.2 * scale;
        const d = 1.15 * scale;
        box(group, w, h, d, mats.concrete, 0, h / 2, 0);
        box(group, w + 0.05, 0.09 * scale, d + 0.05, mats.metal, 0, h * 0.68, 0);
        box(group, 0.12 * scale, h, d + 0.04, mats.dark, 0, h / 2, 0);
        return group;
      }

      [
        [-8, -8, 1.2], [-10, 5, 1.05], [8, 7, 1.15], [10, -5, 1.1],
        [-3, -12, 0.9], [4, -10, 1], [12, 1, 0.85], [-13, -2, 0.85],
        [2, 4, 0.75], [-5, 9, 0.9]
      ].forEach(([x, z, scale]) => addCrate(x, z, scale));

      function addPillar(x, z, height = 4) {
        box(scene, 0.72, height, 0.72, mats.dark, x, height / 2, z);
        box(scene, 1.05, 0.16, 1.05, mats.metal, x, height - 0.15, z);
      }
      [[-15, -15], [15, -15], [-15, 15], [15, 15], [0, -16]].forEach(([x, z]) => addPillar(x, z));

      const barrelMat = new THREE.MeshStandardMaterial({ color: 0x55564b, roughness: 0.62, metalness: 0.55 });
      function addBarrel(x, z) {
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 1.12, 12), barrelMat);
        barrel.position.set(x, 0.56, z);
        barrel.castShadow = true;
        barrel.receiveShadow = true;
        scene.add(barrel);
        for (const y of [0.28, 0.75]) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.035, 6, 14), mats.dark);
          ring.rotation.x = Math.PI / 2;
          ring.position.set(x, y, z);
          scene.add(ring);
        }
      }
      [[-6, 2], [6, -2], [12, 12], [-12, -11]].forEach(([x, z]) => addBarrel(x, z));

      for (let i = 0; i < 13; i += 1) {
        const stain = new THREE.Mesh(
          new THREE.CircleGeometry(0.22 + Math.random() * 0.5, 8),
          mats.blood
        );
        stain.rotation.x = -Math.PI / 2;
        stain.position.set((Math.random() - 0.5) * 28, 0.02, (Math.random() - 0.5) * 28);
        stain.scale.set(1.7, 0.55, 1);
        scene.add(stain);
      }

      const player = {
        health: 100,
        ammo: 12,
        reserve: 60,
        score: 0,
        wave: 0,
        yaw: 0,
        pitch: 0,
        isReloading: false,
        alive: true,
        playing: false,
        paused: false,
        pointerLockPending: false,
        pointerLockUnavailable: false,
        keys: new Set(),
        enemies: [],
        bullets: [],
        effects: [],
        lastShot: 0,
        damageCooldown: 0,
        waveDelay: 0,
        audio: null
      };

      const raycaster = new THREE.Raycaster();
      raycaster.far = 35;
      const aimPoint = new THREE.Vector2(0, 0);
      const up = new THREE.Vector3(0, 1, 0);
      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const movement = new THREE.Vector3();
      const tempVec = new THREE.Vector3();

      const alienMaterials = [
        new THREE.MeshStandardMaterial({ color: 0x3da9a5, roughness: 0.72, metalness: 0.08 }),
        new THREE.MeshStandardMaterial({ color: 0x7569bd, roughness: 0.68, metalness: 0.12 }),
        new THREE.MeshStandardMaterial({ color: 0xc48145, roughness: 0.76, metalness: 0.08 })
      ];
      const alienFaceMaterial = new THREE.MeshStandardMaterial({ color: 0x202c33, roughness: 0.38, metalness: 0.18 });
      const alienEyeMaterial = new THREE.MeshBasicMaterial({ color: 0xb9ff8a });

      function makeAlien(x, z, wave) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        group.userData = {
          health: 1 + Math.floor((wave - 1) / 2),
          speed: 0.73 + wave * 0.075 + Math.random() * 0.16,
          attackTime: 0,
          phase: Math.random() * Math.PI * 2,
          alive: true
        };
        const bodyMat = alienMaterials[Math.floor(Math.random() * alienMaterials.length)];
        const accentMat = new THREE.MeshStandardMaterial({
          color: bodyMat.color.clone().offsetHSL(0.08, 0.16, 0.22),
          roughness: 0.48,
          metalness: 0.25,
          emissive: bodyMat.color,
          emissiveIntensity: 0.12
        });

        const torso = new THREE.Mesh(new THREE.DodecahedronGeometry(0.43, 1), bodyMat);
        torso.scale.set(0.95, 1.18, 0.78);
        torso.position.y = 1.02;
        torso.rotation.y = Math.PI / 10;
        torso.castShadow = true;
        torso.receiveShadow = true;
        group.add(torso);

        const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), accentMat);
        head.scale.set(1.12, 0.88, 0.92);
        head.position.set(0, 1.69, -0.04);
        head.castShadow = true;
        group.add(head);

        const face = new THREE.Mesh(new THREE.SphereGeometry(0.205, 12, 8), alienFaceMaterial);
        face.scale.set(1.12, 0.72, 0.42);
        face.position.set(0, 1.68, -0.29);
        group.add(face);

        for (const [x, y, size] of [[-0.09, 1.68, 0.038], [0.09, 1.68, 0.038], [0, 1.79, 0.025]]) {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 6), alienEyeMaterial);
          eye.position.set(x, y, -0.38);
          group.add(eye);
        }

        for (const [x, height, lean] of [[-0.17, 0.43, -0.38], [0.17, 0.3, 0.46]]) {
          const crest = new THREE.Mesh(new THREE.ConeGeometry(0.105, height, 5), accentMat);
          crest.position.set(x, 1.96 + height * 0.28, 0.015);
          crest.rotation.z = lean;
          crest.rotation.x = -0.16;
          crest.castShadow = true;
          group.add(crest);
        }

        const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.105, 0), alienEyeMaterial);
        core.position.set(0.2, 1.13, -0.29);
        core.rotation.set(0.2, 0.25, 0.4);
        group.add(core);
        const coreRing = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.018, 6, 12), accentMat);
        coreRing.position.copy(core.position);
        coreRing.rotation.y = Math.PI / 2.8;
        group.add(coreRing);

        for (const side of [-1, 1]) {
          const shoulder = new THREE.Mesh(new THREE.DodecahedronGeometry(0.16, 0), accentMat);
          shoulder.scale.set(1, 0.86, 0.82);
          shoulder.position.set(side * 0.39, 1.25, -0.015);
          shoulder.castShadow = true;
          group.add(shoulder);

          const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.46, 3, 6), bodyMat);
          arm.position.set(side * 0.43, 0.97, -0.045);
          arm.rotation.z = side * -0.22;
          arm.rotation.x = -0.28;
          arm.castShadow = true;
          group.add(arm);

          const claw = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.19, 5), accentMat);
          claw.position.set(side * 0.47, 0.68, -0.14);
          claw.rotation.x = -Math.PI / 2;
          claw.rotation.z = side * -0.18;
          group.add(claw);

          const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.43, 3, 6), bodyMat);
          leg.position.set(side * 0.16, 0.4, 0.02);
          leg.castShadow = true;
          group.add(leg);

          const foot = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15, 0), accentMat);
          foot.scale.set(1, 0.58, 1.2);
          foot.position.set(side * 0.16, 0.13, -0.07);
          foot.castShadow = true;
          group.add(foot);
        }

        group.traverse((child) => {
          if (child.isMesh) child.userData.enemy = group;
        });
        scene.add(group);
        player.enemies.push(group);
        return group;
      }

      function updateHud() {
        healthText.textContent = `${Math.ceil(player.health)}%`;
        healthFill.style.width = `${player.health}%`;
        healthFill.style.background = player.health <= 30 ? "#d14f3d" : "#c17a5b";
        ammoText.textContent = String(player.ammo).padStart(2, "0");
        reserveText.textContent = String(player.reserve).padStart(2, "0");
        scoreText.textContent = String(player.score).padStart(3, "0");
        waveText.textContent = player.wave ? `${player.wave} / 3` : "— / 3";
      }

      function showStatus(text, duration = 1800) {
        statusLine.textContent = text;
        statusLine.hidden = false;
        window.clearTimeout(showStatus.timer);
        showStatus.timer = window.setTimeout(() => {
          statusLine.hidden = true;
        }, duration);
      }

      function unlockPointer() {
        if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
      }

      function lockPointer() {
        player.pointerLockPending = true;
        try {
          const result = renderer.domElement.requestPointerLock();
          if (result && typeof result.catch === "function") {
            result.catch((error) => {
              player.pointerLockPending = false;
              player.pointerLockUnavailable = true;
              console.warn("Pointer lock is unavailable; use mouse movement to aim.", error);
              showStatus("滑鼠鎖定不可用 — 移動滑鼠即可瞄準", 3000);
            });
          } else {
            window.setTimeout(() => {
              player.pointerLockPending = false;
              if (!document.pointerLockElement) {
                player.pointerLockUnavailable = true;
                showStatus("滑鼠鎖定不可用 — 移動滑鼠即可瞄準", 3000);
              }
            }, 200);
          }
        } catch (error) {
          player.pointerLockPending = false;
          player.pointerLockUnavailable = true;
          console.warn("Pointer lock is unavailable; use mouse movement to aim.", error);
          showStatus("滑鼠鎖定不可用 — 移動滑鼠即可瞄準", 3000);
        }
      }

      function pauseGame() {
        if (!player.playing || player.paused) return;
        player.paused = true;
        player.keys.clear();
        overlay.hidden = false;
        document.getElementById("overlay-eyebrow").textContent = "GAME PAUSED";
        document.getElementById("overlay-title").textContent = "暫停中";
        document.getElementById("overlay-copy").textContent = "準備好後，繼續守住防線。";
        startButton.textContent = "繼續遊戲";
        unlockPointer();
      }

      function clearGameObjects() {
        for (const enemy of player.enemies) scene.remove(enemy);
        for (const bullet of player.bullets) scene.remove(bullet.mesh);
        for (const effect of player.effects) scene.remove(effect.mesh);
        player.enemies.length = 0;
        player.bullets.length = 0;
        player.effects.length = 0;
      }

      function startWave(wave) {
        player.wave = wave;
        const count = 4 + wave * 2;
        for (let i = 0; i < count; i += 1) {
          const angle = (i / count) * Math.PI * 2 + Math.random() * 0.45;
          const radius = 12.5 + Math.random() * 2.5;
          makeAlien(Math.sin(angle) * radius, Math.cos(angle) * radius, wave);
        }
        updateHud();
        showStatus(`第 ${wave} 波 — ${count} 隻異星生物接近`, 2400);
      }

      function startGame() {
        clearGameObjects();
        player.health = 100;
        player.ammo = 12;
        player.reserve = 60;
        player.score = 0;
        player.wave = 0;
        player.yaw = 0;
        player.pitch = 0;
        player.isReloading = false;
        player.alive = true;
        player.playing = true;
        player.paused = false;
        player.waveDelay = 0;
        camera.position.set(0, 1.7, 7);
        camera.rotation.set(0, 0, 0);
        overlay.hidden = true;
        statusLine.hidden = true;
        updateHud();
        startWave(1);
        lockPointer();
      }

      function resumeGame() {
        player.paused = false;
        overlay.hidden = true;
        lockPointer();
      }

      function endGame(won) {
        player.playing = false;
        player.paused = false;
        player.alive = false;
        unlockPointer();
        overlay.hidden = false;
        document.getElementById("overlay-eyebrow").textContent = won ? "ZONE SECURED" : "SIGNAL LOST";
        document.getElementById("overlay-title").textContent = won ? "防線守住了" : "防線失守";
        document.getElementById("overlay-copy").textContent = won
          ? `你成功清除三波異星生物，累積擊退 ${player.score} 隻。`
          : `異星生物突破了防線。你擊退了 ${player.score} 隻，再試一次吧。`;
        startButton.textContent = "再次出擊";
      }

      function reload() {
        if (!player.playing || player.isReloading || player.ammo === 12 || player.reserve === 0) return;
        player.isReloading = true;
        showStatus("重新裝填中…", 1300);
        window.setTimeout(() => {
          if (!player.playing) {
            player.isReloading = false;
            return;
          }
          const needed = 12 - player.ammo;
          const loaded = Math.min(needed, player.reserve);
          player.ammo += loaded;
          player.reserve -= loaded;
          player.isReloading = false;
          updateHud();
        }, 1050);
      }

      function playShotSound() {
        try {
          if (!player.audio) player.audio = new (window.AudioContext || window.webkitAudioContext)();
          if (player.audio.state === "suspended") player.audio.resume();
          const context = player.audio;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          const now = context.currentTime;
          oscillator.type = "sawtooth";
          oscillator.frequency.setValueAtTime(115, now);
          oscillator.frequency.exponentialRampToValueAtTime(42, now + 0.09);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.1);
        } catch (error) {
          console.warn("Audio playback is unavailable.", error);
        }
      }

      function addHitEffect(position) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 7, 6),
          new THREE.MeshBasicMaterial({ color: 0xb54b36, transparent: true, opacity: 0.9 })
        );
        mesh.position.copy(position);
        scene.add(mesh);
        player.effects.push({ mesh, life: 0.25, maxLife: 0.25 });
      }

      function shoot() {
        if (!player.playing || player.paused || !player.alive || player.isReloading) return;
        const now = performance.now();
        if (now - player.lastShot < 260) return;
        if (player.ammo <= 0) {
          showStatus("彈匣已空 — 按 R 重新裝填", 1000);
          return;
        }
        player.lastShot = now;
        player.ammo -= 1;
        updateHud();
        playShotSound();

        raycaster.setFromCamera(aimPoint, camera);
        const targets = [];
        for (const enemy of player.enemies) {
          if (!enemy.userData.alive) continue;
          enemy.traverse((child) => {
            if (child.isMesh) targets.push(child);
          });
        }
        const hits = raycaster.intersectObjects(targets, false);
        crosshair.classList.add("hit");
        window.setTimeout(() => crosshair.classList.remove("hit"), 110);
        if (!hits.length) return;

        const enemy = hits[0].object.userData.enemy;
        if (!enemy || !enemy.userData.alive) return;
        addHitEffect(hits[0].point);
        enemy.userData.health -= 1;
        if (enemy.userData.health <= 0) {
          enemy.userData.alive = false;
          player.score += 1;
          updateHud();
          const index = player.enemies.indexOf(enemy);
          if (index !== -1) player.enemies.splice(index, 1);
          scene.remove(enemy);
          if (player.enemies.length === 0) {
            if (player.wave >= 3) {
              endGame(true);
            } else {
              player.waveDelay = 2.5;
              showStatus("區域暫時安全 — 下一波即將到來", 2500);
            }
          }
        }
      }

      function damagePlayer(amount) {
        if (player.damageCooldown > 0) return;
        player.health = Math.max(0, player.health - amount);
        player.damageCooldown = 0.7;
        damageFlash.classList.add("active");
        window.setTimeout(() => damageFlash.classList.remove("active"), 170);
        updateHud();
        if (player.health <= 0) endGame(false);
      }

      function updatePlayer(delta) {
        if (!player.playing || player.paused) return;
        const speed = 5.2;
        forward.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        right.crossVectors(forward, up).normalize();
        movement.set(0, 0, 0);
        if (player.keys.has("KeyW")) movement.add(forward);
        if (player.keys.has("KeyS")) movement.sub(forward);
        if (player.keys.has("KeyD")) movement.add(right);
        if (player.keys.has("KeyA")) movement.sub(right);
        if (movement.lengthSq() > 0) {
          movement.normalize().multiplyScalar(speed * delta);
          camera.position.add(movement);
        }
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, -15.2, 15.2);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, -15.2, 15.2);
        camera.position.y = 1.7;
        camera.rotation.order = "YXZ";
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;
        player.damageCooldown = Math.max(0, player.damageCooldown - delta);
      }

      function updateEnemies(delta, time) {
        if (!player.playing || player.paused) return;
        for (let i = player.enemies.length - 1; i >= 0; i -= 1) {
          const enemy = player.enemies[i];
          const data = enemy.userData;
          tempVec.set(camera.position.x - enemy.position.x, 0, camera.position.z - enemy.position.z);
          const distance = tempVec.length();
          if (distance > 1.05) {
            tempVec.normalize();
            enemy.position.addScaledVector(tempVec, data.speed * delta);
            enemy.rotation.y = Math.atan2(-tempVec.x, -tempVec.z);
            enemy.position.y = Math.abs(Math.sin(time * 5 + data.phase)) * 0.045;
            data.attackTime = Math.max(0, data.attackTime - delta);
          } else if (data.attackTime <= 0) {
            damagePlayer(9);
            data.attackTime = 0.95;
          }
        }
      }

      function updateEffects(delta) {
        for (let i = player.effects.length - 1; i >= 0; i -= 1) {
          const effect = player.effects[i];
          effect.life -= delta;
          effect.mesh.scale.setScalar(1 + (1 - effect.life / effect.maxLife) * 2.5);
          effect.mesh.material.opacity = Math.max(0, effect.life / effect.maxLife);
          if (effect.life <= 0) {
            scene.remove(effect.mesh);
            effect.mesh.material.dispose();
            player.effects.splice(i, 1);
          }
        }
      }

      function resize() {
        const width = Math.max(1, mount.clientWidth);
        const height = Math.max(1, mount.clientHeight);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      startButton.addEventListener("click", () => {
        if (!player.audio && (window.AudioContext || window.webkitAudioContext)) {
          player.audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (player.playing && player.paused) resumeGame();
        else startGame();
      });

      renderer.domElement.addEventListener("click", () => {
        if (player.playing && player.paused) resumeGame();
        else if (player.playing && !document.pointerLockElement) lockPointer();
      });
      renderer.domElement.addEventListener("mousedown", (event) => {
        if (event.button === 0) shoot();
      });
      document.addEventListener("pointerlockchange", () => {
        const locked = document.pointerLockElement === renderer.domElement;
        if (locked) {
          player.pointerLockPending = false;
          player.pointerLockUnavailable = false;
        }
        crosshair.classList.toggle("active", locked && player.playing);
        if (locked) {
          aimPoint.set(0, 0);
          crosshair.style.left = "";
          crosshair.style.top = "";
        }
        if (!locked && player.playing && !player.paused && !player.pointerLockPending && !player.pointerLockUnavailable) pauseGame();
      });
      document.addEventListener("mousemove", (event) => {
        if (!player.playing || player.paused) return;
        if (document.pointerLockElement === renderer.domElement) {
          player.yaw -= event.movementX * 0.0022;
          player.pitch = THREE.MathUtils.clamp(player.pitch - event.movementY * 0.0022, -1.35, 1.35);
        } else {
          const bounds = renderer.domElement.getBoundingClientRect();
          aimPoint.set(
            ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
            -((event.clientY - bounds.top) / bounds.height) * 2 + 1
          );
          crosshair.style.left = `${event.clientX}px`;
          crosshair.style.top = `${event.clientY}px`;
          crosshair.classList.add("active");
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.code === "Escape" && player.playing && !player.paused) {
          event.preventDefault();
          pauseGame();
          return;
        }
        if (["KeyW", "KeyA", "KeyS", "KeyD", "Space"].includes(event.code)) event.preventDefault();
        player.keys.add(event.code);
        if (event.code === "KeyR") reload();
      });
      document.addEventListener("keyup", (event) => player.keys.delete(event.code));
      window.addEventListener("blur", () => player.keys.clear());
      window.addEventListener("resize", resize);
      resize();

      let previousTime = performance.now();
      function animate(now) {
        requestAnimationFrame(animate);
        const delta = Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;
        updatePlayer(delta);
        updateEnemies(delta, now / 1000);
        updateEffects(delta);
        if (player.playing && !player.paused && player.waveDelay > 0) {
          player.waveDelay -= delta;
          if (player.waveDelay <= 0) startWave(player.wave + 1);
        }
        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
      loading.hidden = true;
    })();
  </script>
</body>
</html>
